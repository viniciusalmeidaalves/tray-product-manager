name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository metadata
        run: |
          echo "Checking repository metadata files..."
          ls -1 .github || true
          echo "Documentation and GitHub standard files are present."
